# Local dev environment. `docker compose up` brings everything up:
#   - backend (FastAPI/uvicorn) on :8000 with hot reload, talking to this
#     app's `-localdev` Aurora DSQL cluster in AWS (DSQL has no local
#     emulator; the twin is free when idle and isolated from prod)
#   - frontend (Vite) on :5173 with HMR; /api/* proxies to backend
#
# Source code is bind-mounted from host so edits are live without rebuild.
# node_modules lives in a named volume (Docker-native FS, not the host bind
# mount) so it doesn't slow down macOS volume mounts.

services:
  backend:
    build: ./backend
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ~/.aws:/root/.aws:ro # AWS credentials: DSQL, Bedrock, localdev twins
    environment:
      # Database: SSM parameter holding the -localdev DSQL cluster endpoint
      # (created when database_enabled = true and /initialize has run).
      # Missing parameter = no database; db.enabled() is False.
      DSQL_ENDPOINT_PARAM: /__AWS_PROFILE__/apps/__APP_NAME__/dsql_endpoint_localdev
      QUICKSHIP_MIGRATE_ON_STARTUP: "1"
      AWS_REGION: __AWS_REGION__
      AWS_DEFAULT_REGION: __AWS_REGION__
      AWS_PROFILE: __AWS_PROFILE__
      # Anthropic API key for app/lib/ai_claude. In prod the platform
      # injects this via SSM SecureString → Lambda env. Locally we pass
      # the host's exported value through. To exercise Claude calls
      # locally, run: export ANTHROPIC_API_KEY=sk-ant-...
      # Unset = ai_claude raises a clear "not set" error on first call.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Capability env vars below point at the per-app `-localdev` AWS
      # twins (DynamoDB tables and S3 bucket) provisioned alongside prod.
      # When set, kv.py / storage.py use real AWS via the dev's profile;
      # when unset (e.g. before /initialize ran), they fall back to local
      # SQLite / ./uploads/ for greenfield iteration.
__CAPABILITY_ENV_VARS__

  frontend:
    build: ./frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
